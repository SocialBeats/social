openapi: 3.0.0
info:
  title: Social microservice API
  version: unknown
  description: This is an OAS description of this social microservice REST API
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ConversationResponse:
      type: object
      properties:
        _id:
          type: string
          description: ID único de la conversación.
          example: 6655c69992f44200159422a5
        participants:
          type: array
          items:
            type: string
          description: Array de IDs de los 2 participantes.
        lastMessage:
          type: object
          description: Metadatos del último mensaje (texto, hora, remitente).
          properties:
            text:
              type: string
            timestamp:
              type: string
              format: date-time
            senderId:
              type: string
              description: ID del remitente.
        unreadCount:
          type: object
          description: >-
            Contador de mensajes no leídos por participante (clave=userId,
            valor=count).
          example:
            6655c69992f44200159422a5: 5
            otro_id: 0
        isDeletedBy:
          type: object
          description: >-
            Estado de eliminación lógica por participante (clave=userId,
            valor=boolean).
        updatedAt:
          type: string
          format: date-time
          description: Fecha de la última actividad (usado para ordenar).
paths:
  /api/v1/about:
    get:
      tags:
        - Documentation
      summary: Retrieve the entire README file as HTML.
      description: Reads the entire README file and returns its content as HTML.
      responses:
        '200':
          description: Successfully retrieved the README file content as HTML.
          content:
            text/html:
              schema:
                type: string
                description: The HTML content of the README file.
        '500':
          description: Error reading the README file.
          content:
            text/plain:
              schema:
                type: string
                description: Error message when the file cannot be read.
                example: 'Error reading the file: [error details]'
  /api/v1/version:
    get:
      tags:
        - Documentation
      summary: Retrieve the API version from the .version file.
      description: >-
        Reads the .version file and returns its content as part of a JSON
        message.
      responses:
        '200':
          description: Successfully retrieved the API version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The current API version.
                    example: v1.0.0
        '500':
          description: Error reading the .version file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message summary.
                    example: There was an error retrieving API version
                  error:
                    type: string
                    description: Detailed error message.
                    example: 'ENOENT: no such file or directory, open ''.version'''
  /api/v1/changelog:
    get:
      tags:
        - Documentation
      summary: Retrieve the API changelog.
      description: >
        Reads the `CHANGELOG.md` file, parses its content, and returns it as
        HTML. Supports filtering by specific versions, multiple versions, or a
        version range.
      parameters:
        - in: query
          name: versions
          schema:
            type: string
          description: >
            Comma-separated list of release versions to retrieve (e.g.
            `v2.1.4,v2.1.2`).
        - in: query
          name: from
          schema:
            type: string
          description: >
            Starting release version for the changelog range (inclusive, e.g.
            `v2.1.2`).
        - in: query
          name: to
          schema:
            type: string
          description: >
            Ending release version for the changelog range (inclusive, e.g.
            `v2.1.4`).
      responses:
        '200':
          description: Successfully retrieved the changelog.
          content:
            text/html:
              schema:
                type: string
                description: The HTML representation of the changelog or filtered releases.
        '500':
          description: Error reading the CHANGELOG.md file.
          content:
            text/plain:
              schema:
                type: string
                description: Error message when the changelog cannot be read.
                example: >-
                  There was an error retrieving API release notes: ENOENT: no
                  such file or directory, open 'CHANGELOG.md'
  /api/v1/conversations:
    get:
      tags:
        - Conversations
      summary: Listar todas las conversaciones del usuario
      description: >-
        Obtiene la bandeja de entrada del usuario autenticado, ordenada por la
        actividad más reciente.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de conversaciones del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: No autorizado (Token JWT faltante o inválido)
  /api/v1/conversations/{convId}:
    get:
      tags:
        - Conversations
      summary: Obtener metadatos de una conversación
      description: Obtiene la información de una conversación por su ID.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: convId
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la conversación.
      responses:
        '200':
          description: Metadatos de la conversación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: No autorizado
        '403':
          description: Prohibido (El usuario no es participante)
        '404':
          description: Conversación no encontrada
    delete:
      tags:
        - Conversations
      summary: Eliminar lógicamente una conversación
      description: >-
        Marca la conversación como eliminada para el usuario solicitante
        (eliminación lógica).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: convId
          required: true
          schema:
            type: string
          description: ID de la conversación.
      responses:
        '200':
          description: Conversación marcada como eliminada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Conversación eliminada lógicamente.
        '401':
          description: No autorizado
        '403':
          description: Prohibido
        '404':
          description: Conversación no encontrada
  /api/v1/conversations/{convId}/read:
    put:
      tags:
        - Conversations
      summary: Marcar conversación como leída
      description: >-
        Resetea el contador 'unreadCount' del usuario autenticado a 0 para esta
        conversación.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: convId
          required: true
          schema:
            type: string
          description: ID de la conversación.
      responses:
        '200':
          description: Contador de mensajes no leídos reseteado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Conversación marcada como leída.
                  updatedConversation:
                    $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: No autorizado
        '403':
          description: Prohibido
        '404':
          description: Conversación no encontrada
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns basic information to verify that the API is running properly.
      responses:
        '200':
          description: API is healthy and responding.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Health check successful
                  version:
                    type: string
                    example: 1.0.0
                  uptime:
                    type: number
                    example: 123.45
                  timestamp:
                    type: string
                    format: date-time
                    example: '2025-11-08T13:41:47.074Z'
                  environment:
                    type: string
                    example: development
                  db:
                    type: string
                    example: connected
tags:
  - name: Conversations
    description: Gestión de conversaciones (metadata, listado y estado de lectura)
